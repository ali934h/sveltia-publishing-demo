backend:
  name: github
  repo: ali934h/sveltia-publishing-demo
  branch: main
  auth_methods: [token]

site_url: https://ali934h.github.io/sveltia-publishing-demo/
display_url: https://ali934h.github.io/sveltia-publishing-demo/
publish_mode: preview
media_folder: public/uploads
public_folder: /sveltia-publishing-demo/uploads

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    preview_path: /sveltia-publishing-demo/articles/{{slug}}/
    fields:
      - { name: title, label: Title, widget: string }
      - name: language
        label: Language
        widget: select
        options:
          - { label: Persian, value: fa }
          - { label: English, value: en }
          - { label: Russian, value: ru }
      - { name: description, label: Summary, widget: text }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: youtube, label: YouTube URL, widget: string, required: false }
      - { name: aparat, label: Aparat URL, widget: string, required: false }
      - { name: body, label: Body, widget: richtext }
